name: CI

on:
  push:
    branches:
      - develop
      - master

env:
  NODE_ENV: test
  PORT: 3333
  HOST: 0.0.0.0
  LOG_LEVEL: error
  APP_KEY: adonisjs_tutorial_ci_test_key_01
  APP_URL: http://localhost:3333
  SESSION_DRIVER: memory
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: adonisjs_tutorial_test
  JWT_SECRET: adonisjs_tutorial_ci_jwt_secret
  JWT_EXPIRY: 1d
  HASH_DRIVER: argon
  LIMITER_STORE: database
  THROTTLE_AUTH_MAX: 5
  THROTTLE_AUTH_WINDOW: 60

jobs:
  ci:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adonisjs_tutorial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run migrations
        run: node ace migration:run --force

      - name: Run tests
        run: npm test
